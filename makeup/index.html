        These are just 3 of the articles sent my way in the past 48 hours. 1. from a recent US study reporting that black babies are 3 x more likely to die when treated by a white doctor.  2. Black &amp; brown children being 3x more likely to be tasered by the police &amp; 3. a black police inspector being racially profiled by the police. Yes. Read that again. 
        .
        These are all of the micro &amp; macro ways racism seeps in several times a day, everyday. Just from reading the news. Donât get me started on the N word &amp; the BBC.
        .
        Iâm going to focus on the first picture today. For those feeling an urge to respond with âthis isnât a problem in the U.K.â Oh yes it is. Itâs just better hidden. Take a look at the MBRRACE report. This is frightening &amp; heartbreaking as hell, but not shocking. Having read how much the foundation of medicine we know today, was founded on medical racism gives us information on some of the âwhyâ. Having heard horror stories from colleagues working in healthcare of how catastrophic unchecked bias can be where the stakes are so high, having heard personal accounts from patients in interviews that were so devastating I had to terminate them to preserve my own mental health. This ISNâT up for debate, but it certainly needs discussion.
        .
        Because we have a problem.
        .
        Are the majority of doctors going round intentionally wanting to cause harm to black babies. I powerfully doubt that. But the outcome, regardless of intent, remains deeply worrying. 
        .
        The need to raise awareness is necessary when so many are still sleepwalking. But just consider the impact these CONSTANT headlines have on the mental health of black &amp; brown folk. How that contributes to anxiety. How many more studies &amp; data need to be collated before action and serious investigation is undertaken to safeguard black &amp;  brown children? 
        .
        This is why my anti-racism course focuses on systemic racism. These are some of the painful byproducts of institutionalised racism. If we are too offended &amp; outraged at the thought our healthcare (&amp; criminal justice system) may be flawed, if we are too scared to look at what is going on &amp; why? How can we improve outcome">
