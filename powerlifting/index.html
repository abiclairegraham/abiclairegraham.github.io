      <div class="gallery-grid">

                <figure class="gallery-item">
                  <img src="/assets/images/powerlifting/2023/17964226343324063.webp" alt="Gradually got some of the hench back now, more would be great obviously but I feel more like myself ð

        Long story but I accidentally gradually lost about 5kg in weight last year because in addition to my starch and sugars intolerance I developed an intolerance to many fats too, causing me to wake with stomach pains every night. Thought it might be an ulcer but tests said no. Dropping my fat intake down helped, but left me with insufficient calories, hence the weight (and strength) loss ð 

        Had to drop my training right back to easy sessions twice a week until I could eat more. Now back up to 3 times a week and I&#x27;ll stick here for a bit.

        So. I am extremely grateful to have gained back weight, profoundly grateful for improved health for now (which didn&#x27;t just happen, it took relentless self experimentation as well as some lucky discoveries), and a slightly wider range of foods again that I can eat.

        Worth noting that when I was lighter last year, it probably looked like I was in &quot;great condition&quot;, when in actual fact I wasn&#x27;t well. 

        #strongwomen #feminist #powerlifting #grrrlarmy">

                <figure class="gallery-item">
                  <img src="/assets/images/powerlifting/2019/17854092700617633.jpg" alt="Can/should kids lift weights?? YES!!
        _
        And so should elderly people for many of the same reasons! It builds bone and physical resilience at any age, with much lower risk of injury than most other sportsð
        _
         #Repost @mikelifts (@get_repost)
        ã»ã»ã»
        Transformation age 15 to 23! ðªð¼
        -
        Todays topic on my mind: Is it safe for kids to get into powerlifting/ bodybuilding??
        -
        Many still argue against younger individuals and teenagers getting into powerlifting and bodybuilding because it stunts growth. But the evidence screams the opposite! Children should avoid engaging in high impact, twisting and falling movements as this is what can fracture growth plates and stunt growth. NOTHING in powerlifting or bodybuilding has to involve any kind of impact movement!
        -
        On the contrary all the sports that kids are made to do; football, rugby and basketball are all high impact sports with twisting and falling VERY common that can fracture growth plates.
        -
        In my whole time lifting the worst injury I&#x27;ve had is persistent but mild tendonitis. However, I&#x27;ve had too many injuries to count from the limited amounts of rugby, football, hiking and running I&#x27;ve done over the years.
        -

        _
        *******
        Have you ever heard someone say that Mo Farah isn&#x27;t very masculine or attractive because of his small build and because he doesn&#x27;t have enough muscle, and therefore looks feminine? Did anyone ever comment that Tyson Gay&#x27;s thrilling masculinity is great for the sport of athletics?
        _
        _
        Probably not, because those athletes haven&#x27;t built their bodies for the purpose of being admired - their bodies are both incredible and perfect machines for producing super-human sporting performance! Masculinity has nothing to do with it.
        _
        _
        Now of course, there are some athletes who happen to have a body which is a thing of great beauty, and of course we admire this. But generally, to place much focus on the attractiveness or &quot;masculinity/femininity&quot; of an athlete diminishes incredibly the entire point of what they have built their body to do, and shows very little appreciation for the thing they have given blood, sweat and tears to attain - their incredible athletic accomplishments.
        _
        _
        For many of us women, Powerlifting has freed us from the often-wearing way that we (as women) are valued subjectively on our appearance, and whether or not that is deemed &quot;appealing&quot; - usually to the opposite sex. 
        _
        _
        Just look at examples like the extremely engaging, witty and academically-brilliant historian Mary Beard being supposedly &quot;too ugly for television&quot;?! Or the Williams sisters being referred to as &quot;brothers&quot;. Or the unbelievable example of tennis star Eugenie Bouchard being asked to &quot;twirl&quot; and show off her outfit just after she&#x27;d decisively won a match?
        _
        _
        In Powerlifting, instead, we are valued on the objectively-incredible things our bodies are capable of, and on our courage, perseverance, and the truly monstrous efforts we put in when we lift very heavy things. 
        _
        _
        &quot;Femininity&quot; should play no role in strength-sports any more than &quot;masculinity&quot; should play a role - because the point of strength-sports is entirely performance not aesthetics.
        _
        _
        However... (continued in comments!! ð)">

                  <img src="/assets/images/powerlifting/2018/17950000582173327.jpg" alt="Noticed I had a decent pump after training tonight (did a lot of work in just one hour). I&#x27;ve trained 5 days a week for the last few years - apart from if it&#x27;s Christmas or I&#x27;m on holiday in which case it&#x27;s 3-4 times a week!

        Q&amp;A: Keto diet â myths - pros &amp; cons â best vegan staple foods ð± - - ð Keto myths: - -

        Myth 1: Keto diet is better for weight loss. ðð¼. Well controlled research studies found no evidence that keto diet speeds up weight loss. In contrast, in one research study higher carb diet lead to significantly higher fat loss than keto diet. - -

        Myth 2: You have to limit all carbs on a keto diet. ðð¼ On a keto diet you have to limit sugar and starches (net carbs), however, you still need to get enough fiber and consume fiber-rich veggies. Fiber is converted to short chain fatty acids by gut bacteria and we absorb fat and not carbs when we eat fiber. - -

        Myth 3: Eating lots of protein is ok on keto. ðð¼ On a keto diet you have to get enough protein, but not more than you actually need. Excess protein is converted into carbs in the body. If you eat too much protein you wonât be able to get into the keto state. - -

        Myth 4: Keto diet is unhealthy. ðð¼ This is not true. If the keto diet is well planned, it can be totally healthy. For people with certain conditions, such as epilepsy, keto diet is even beneficial. - - â         Keto pros: - - ðð¼ Appetite suppressant effect: A reason why the keto diet works for some people is the fact that keto diet seems to be more appetite suppressant (at least for certain individuals) than a higher carbohydrate diet. Thus, it is possible that keto diet may be better, simply because some people lose their appetites and as a result eat less. - - ðð¼ Stricter restrictions: Ketogenic diet puts very high restrictions on food choices. It excludes most junk food and food many people are likely to overeat on (Yummy carbs!). Restrictions in food choices can not only lead to eating less, which is the major point of a diet, but also reduce the chance of overeating by eliminating the food that is tempting. Keto diet seems to work well for people with an all-or-nothing mindset. - - â Keto cons: - - ðð¼ The restrictive nature of the keto diet can make the life less enjoyable for many people, as they have to exclude the food they like, it is more difficult to socialize and go out with friends for food. - ðð¼con">

                <figure class="gallery-item">
                  <img src="/assets/images/powerlifting/2018/18070575166090999.jpg" alt="My first ever IG food post...? ð¤ I think it  might be! ð Anyway, this is how I made a very healthy McDonald&#x27;s meal today! ð So... &quot;healthy food&quot; is nearly always context dependent - and my definition of healthy food is this: 
        _
        Food is &quot;healthy&quot; if it gives you more of the nutrients your body is in need of (at that point in time), whilst giving little of the nutrients or toxins that your body doesn&#x27;t need - it will be beneficial to your health to eat that food. 
        _
        Here, we have the McDonald&#x27;s burgers. Actually, beef is one of the most nutritious foods you can eat! High in many micronutrients (and most of us tend to be short of a few micronutrients even on a good wholefoods diet), and of course high in protein. I think most people would be healthier if they ate more protein.
        _
        However, with the burgers, I don&#x27;t have the fries or bun, and in this case, I have a low-carb protein-bread that I made in around 7 minutes including 5 mins cooking time!
        _
        This makes this far healthier for me because I have a starch intolerance so cannot eat wheat or potatoes. My bread is also high in fibre which is probably good for gut health.
        _
        There is also some sauerkraut mixed with &quot;Lighter than Light&quot; mayonnaise - there is already nutritious fat from the beef, so the omega 6 oils in regular mayonnaise would simply be a source of excess calories, plus too much omega 6 isn&#x27;t that good for you. The sauerkraut has a range of micronutrients as well as being good for the gut due to the vegetable fibres, whilst containing few calories.
        _
        And obviously the tomatoes are good too.
        _
        So in short, this meal supplies lots of high quality protein and micronutrients, with some nice saturated fats to fuel my training later (but avoiding piling on additional unnecessary fats from carbs or mayonnaise). The meal was very healthy because it contained almost entirely things my body needed with very little that it didn&#x27;t.
        _
        I do have some carbs in my diet but probably only around 100g a day, from fruit, veg, some chocolate and glucose. I personally don&#x27;t feel good with much more carbs than this.">
