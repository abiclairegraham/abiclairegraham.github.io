                <figure class="gallery-item">
                  <img src="/assets/images/powerlifting/2020/17844125522026536.jpg" alt="Damn... where to begin?! So, I was honoured to represent Team GB today in the IPF European Masters Classic Powerlifting comp today in Albi, France. And very grateful to leave with the Gold overall in the under-63kg-class ages 40-49! ððª
        _
        This was some of the most pressure I have ever experienced in a comp, as based on qualifying results, it looked like I&#x27;d be the favourite - but so close that a single mistake on any lift would be Game Over! And @mina_bakker and @rakelaton did indeed deliver a very hard fight! I needed a European Masters deadlift record of 188kg to get the win over @mina_bakker by a mere half kilo, so it was pretty dramatic! I totalled 408kg in the end, bodyweight 62.14kg, getting all 9 lifts.
        _
        But this training cycle has delivered some pretty tough storms to weather... Starting with Labyrinthitis (a sudden acute inner ear disorder) on the 20th December which left me literally unable to walk for a whole day (and conclusively throwing up with the tiniest movement of my head!) Then a week-long course of heavy corticosteroids in January to try to treat it, which left me exhausted and even walking was quite an effort as my legs were affected. And then a very enjoyable injection of more corticosteroids into my eardrum at the end of that week! ð­ My hearing is still a little impaired even now, and I&#x27;m still slightly unsteady on my feet.
        _
        Add to that a plague of sleeping problems for the last few months, various things waking me many times a night every night, including stomach gastritis which has meant I had to limit my already very constrained diet even further and lost weight unintentionally because I simply couldn&#x27;t tolerate a lot of foods.
        _
        And lastly, starting the year with some knee instability which plagued me for months last year preventing me from squatting at all unless I&#x27;d rolled my whole IT band for about 30 minutes every single session ð­ But mercifully, stiff-legged deadlifts added in mid-January on a hunch proved to have miraculous benefits for this and produced a great improvement in just a week or so. (continued in comments!! ð)">
          
                </figure>

        Have you ever heard someone say that Mo Farah isn&#x27;t very masculine or attractive because of his small build and because he doesn&#x27;t have enough muscle, and therefore looks feminine? Did anyone ever comment that Tyson Gay&#x27;s thrilling masculinity is great for the sport of athletics?
        _
        _
        Probably not, because those athletes haven&#x27;t built their bodies for the purpose of being admired - their bodies are both incredible and perfect machines for producing super-human sporting performance! Masculinity has nothing to do with it.
        _
        _
        Now of course, there are some athletes who happen to have a body which is a thing of great beauty, and of course we admire this. But generally, to place much focus on the attractiveness or &quot;masculinity/femininity&quot; of an athlete diminishes incredibly the entire point of what they have built their body to do, and shows very little appreciation for the thing they have given blood, sweat and tears to attain - their incredible athletic accomplishments.
        _
        _
        For many of us women, Powerlifting has freed us from the often-wearing way that we (as women) are valued subjectively on our appearance, and whether or not that is deemed &quot;appealing&quot; - usually to the opposite sex. 
        _
        _
        Just look at examples like the extremely engaging, witty and academically-brilliant historian Mary Beard being supposedly &quot;too ugly for television&quot;?! Or the Williams sisters being referred to as &quot;brothers&quot;. Or the unbelievable example of tennis star Eugenie Bouchard being asked to &quot;twirl&quot; and show off her outfit just after she&#x27;d decisively won a match?
        _
        _
        In Powerlifting, instead, we are valued on the objectively-incredible things our bodies are capable of, and on our courage, perseverance, and the truly monstrous efforts we put in when we lift very heavy things. 
        _
        _
        &quot;Femininity&quot; should play no role in strength-sports any more than &quot;masculinity&quot; should play a role - because the point of strength-sports is entirely performance not aesthetics.
